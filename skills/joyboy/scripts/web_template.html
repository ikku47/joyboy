<!doctype html>
<!-- joyboy web scene template. Copy into a project's assets/, edit, and use film.web("assets/scene.html", dur=4).
     {{GSAP}} is replaced with the folder that holds gsap.min.js and every GSAP plugin (SplitText, MorphSVGPlugin,
     DrawSVGPlugin, MotionPathPlugin, ScrambleTextPlugin, Flip, CustomEase, Physics2DPlugin, ...).
     Rules: size everything in vw/vh so one page fits every shape; build ONE paused timeline and expose it
     as window.tl; no setTimeout, no CSS animations, no autoplay - the capture moves the timeline frame by frame. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0d1117; color: #fff; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
  .stage { position: absolute; inset: 0; display: grid; place-items: center; }
  h1 { font-size: 13vmin; font-weight: 800; letter-spacing: -0.02em; margin: 0; text-align: center; line-height: 1; }
  .bar { position: absolute; left: 12vw; right: 12vw; bottom: 30vh; height: 1.2vmin; background: #ff5a36; transform-origin: left center; border-radius: 1vmin; }
  .dot { position: absolute; width: 5vmin; height: 5vmin; border-radius: 50%; background: #58a6ff; left: 10vw; top: 22vh; }
</style>
<script src="{{GSAP}}/gsap.min.js"></script>
<script src="{{GSAP}}/SplitText.min.js"></script>
<script src="{{GSAP}}/MotionPathPlugin.min.js"></script>
</head>
<body>
<div class="stage"><h1 id="t">MADE WITH<br>GSAP</h1></div>
<div class="bar"></div><div class="dot"></div>
<script>
  gsap.registerPlugin(SplitText, MotionPathPlugin);
  const split = new SplitText("#t", { type: "chars" });
  window.tl = gsap.timeline({ paused: true })
    .from(split.chars, { yPercent: 120, opacity: 0, rotation: 12, duration: 0.7, ease: "back.out(1.7)", stagger: 0.04 })
    .from(".bar", { scaleX: 0, duration: 0.8, ease: "power3.inOut" }, 0.3)
    .to(".dot", { duration: 2.2, ease: "power1.inOut", motionPath: { path: [{ x: "30vw", y: "8vh" }, { x: "60vw", y: "-4vh" }, { x: "78vw", y: "10vh" }], curviness: 1.5 } }, 0.2)
    .to(split.chars, { opacity: 0, yPercent: -60, duration: 0.4, stagger: 0.02, ease: "power2.in" }, 3.2);
</script>
</body>
</html>
